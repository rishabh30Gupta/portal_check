name: Portal Health Check

on:
  # Schedule removed — cron-job.org triggers this via workflow_dispatch
  # every 10 minutes using the GitHub API, which is far more reliable
  # than GitHub's built-in cron scheduler.
  # See README for cron-job.org setup instructions.

  # Keeps manual one-off runs available from the GitHub Actions UI
  workflow_dispatch:

jobs:
  check:
    name: Check Portals
    runs-on: ubuntu-latest
    timeout-minutes: 5    # hard cap — prevents runaway jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # State is persisted in a GitHub Gist between runs — no cache needed.
      # The script reads state at startup and writes it back before exiting.
      - name: Run portal health check
        continue-on-error: true   # portal being DOWN is expected — don't fail the job
        env:
          STAGING_URL:        ${{ secrets.STAGING_URL }}
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          GIST_TOKEN:         ${{ secrets.GIST_TOKEN }}
          GIST_ID:            ${{ secrets.GIST_ID }}
        run: python check_portals.py
        # Exits with code 1 when a portal is DOWN →
        # the job is marked as failed in the Actions UI (red ✗)
